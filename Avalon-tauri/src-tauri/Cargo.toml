[package]
name = "avalon"
version = "0.4.0"
description = "Avalon - AI agent 应用"
authors = ["duedudu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "avalon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘常驻的前提。关窗口后进程靠托盘图标存活，它也是启停渠道与退出的唯一入口
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 单实例：飞书长连接是集群模式且不广播，两个实例连同一个 app 会把消息随机分走
tauri-plugin-single-instance = "2"
# 通知：首次隐藏到托盘时告知用户「还活着」，否则会以为应用已退出
tauri-plugin-notification = "2"
# 日志：打包后是 GUI 程序，没有 stdout，托盘/定时任务/飞书三条无人值守路径全靠它留痕
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
futures-util = "0.3"
# 飞书渠道：长连接走私有 protobuf 帧协议，webpki-roots 与 reqwest 的 rustls-tls 保持一致
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
prost = "0.14"
url = "2"
rand = "0.9"
dirs = "6"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
encoding_rs = "0.8"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
bincode = "1.3"
chrono = "0.4"
tauri-plugin-dialog = "2.7.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
