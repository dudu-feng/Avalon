使用前请把文件名修改为Avalon-config.toml（即去掉template模板后缀）

active_model = "default"

[paths]
data_root = "f:/Avalon/data"
file_root = "f:/Avalon/file"

[[models]]
name = "default"
url = "https://api.deepseek.com"
key = "sk-17d3435ea890403f966657d3258bd500"
modelname = "deepseek-v4-flash"

[[models]]
name = "mimo-tokenplan"
url = "https://token-plan-cn.xiaomimimo.com/v1"
key = "tp-c162nersrvds03vtihgosd9ni1dutwtjkfuvpj6ux2wmfqeo"
modelname = "mimo-v2.5-pro"

[llm]
chat_temperature = 0.699999988079071
json_temperature = 0.10000000149011612
timeout_secs = 120

[embedding]
mode = "local"
local_model = "bge-small-zh-v1.5"
device = "cpu"
load_mode = "lazy"
api_key = ""
api_model = ""
api_base_url = ""

[session_memory]
compress_threshold = 10240
max_chunks = 10
context_chunks = 5
search_mode = "hybrid"

[whisper]
model_name = "medium"
device = "cpu"

[vector]
backend = "memory"

[feishu]
enabled = false
app_id = ""
app_secret = ""
domain = "https://open.feishu.cn"
group_require_mention = true
allow_users = []
session_mode = "unified"
# 进度表情：在用户那条消息上标注处理进度，同一时刻只挂一个。
# 值必须是飞书的 emoji_type 枚举，不能填 Unicode 字符（否则接口报 231001）。
# 留空 = 关闭该状态的标记。
queued_reaction = "OneSecond"             # 排队等待中
processing_reaction = "OnIt"              # 正在处理
done_reaction = "DONE"                    # 处理成功
failed_reaction = "ERROR"                 # 处理失败
rejected_reaction = "Sigh"                # 积压超限，本条不处理